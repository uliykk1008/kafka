<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAFKA</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020006;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
}


/* ================================
   TOMBOL AWAL
================================ */

.start {
    position: fixed;
    z-index: 20;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    cursor: pointer;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.start.hide {
    opacity: 0;
    transform:
        translate(-50%, -50%)
        scale(1.8);

    pointer-events: none;
}

.click-text {
    color: white;

    font-size: 16px;

    letter-spacing: 5px;

    margin-bottom: 18px;

    text-shadow:
        0 0 10px #ff8bdc,
        0 0 25px #ff299f;
}

.heart-button {
    width: 70px;
    height: 70px;

    margin: auto;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;

    font-size: 30px;

    background:
        radial-gradient(
            circle,
            #ff8bdc,
            #ff1493,
            #8b2cff
        );

    box-shadow:
        0 0 15px #ff5bc7,
        0 0 35px #ff1493,
        0 0 70px #8b2cff;

    animation:
        buttonPulse 1.6s
        infinite ease-in-out;
}

@keyframes buttonPulse {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}


/* ================================
   KAFKA
================================ */

.name {
    position: fixed;

    z-index: 5;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%)
        scale(.5);

    color: white;

    font-size:
        clamp(45px, 15vw, 120px);

    font-weight: 700;

    letter-spacing: 15px;

    opacity: 0;

    pointer-events: none;

    text-shadow:
        0 0 8px white,
        0 0 20px #ffb6df,
        0 0 45px #ff4db8,
        0 0 90px #ff1684;
}

.name.show {
    animation:
        kafkaAppear 3s
        cubic-bezier(.2,.8,.2,1)
        forwards,
        kafkaGlow 3s
        ease-in-out
        infinite
        3s;
}

@keyframes kafkaAppear {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.2);

        filter: blur(30px);
    }

    55% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.12);

        filter: blur(0);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);

        filter: blur(0);
    }
}

@keyframes kafkaGlow {

    0%, 100% {
        text-shadow:
            0 0 8px white,
            0 0 20px #ffb6df,
            0 0 45px #ff4db8,
            0 0 80px #ff1684;
    }

    50% {
        text-shadow:
            0 0 15px white,
            0 0 35px #ffb6df,
            0 0 70px #ff4db8,
            0 0 120px #ff1684;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>


<!-- ================================
     TOMBOL PEMBUKA
================================ -->

<div class="start" id="start">

    <div class="click-text">
        KAFKA
    </div>

    <div class="heart-button">
        ♡
    </div>

</div>


<!-- ================================
     NAMA
================================ -->

<div class="name" id="name">
    KAFKA
</div>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const start =
    document.getElementById("start");

const name =
    document.getElementById("name");


let width;
let height;

let started = false;

let startTime = 0;


/* ================================
   RESIZE
================================ */

function resize() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* ================================
   PARTICLES
================================ */

const particles = [];

const particleCount = 1800;


for (
    let i = 0;
    i < particleCount;
    i++
) {

    const angle =
        Math.random() *
        Math.PI *
        2;

    const radius =
        Math.random() *
        Math.max(
            width,
            height
        );

    particles.push({

        x:
            width / 2 +
            Math.cos(angle) *
            radius,

        y:
            height / 2 +
            Math.sin(angle) *
            radius,

        targetX:
            width / 2,

        targetY:
            height / 2,

        size:
            Math.random() *
            2 +
            .4,

        phase:
            Math.random() *
            Math.PI *
            2,

        opacity:
            Math.random() *
            .8 +
            .2
    });
}


/* ================================
   STARS
================================ */

const stars = [];


for (
    let i = 0;
    i < 300;
    i++
) {

    stars.push({

        x:
            Math.random() *
            width,

        y:
            Math.random() *
            height,

        size:
            Math.random() *
            1.5,

        phase:
            Math.random() *
            Math.PI *
            2
    });
}


function drawStars(time) {

    for (
        const star of stars
    ) {

        const alpha =
            .15 +
            Math.sin(
                time * .002 +
                star.phase
            ) * .25;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(
                255,
                220,
                245,
                ${alpha}
            )`;

        ctx.fill();
    }
}


/* ================================
   TARGET TEXT
================================ */

const textCanvas =
    document.createElement(
        "canvas"
    );

const textCtx =
    textCanvas.getContext(
        "2d"
    );


function createTargets() {

    textCanvas.width =
        width;

    textCanvas.height =
        height;


    textCtx.clearRect(
        0,
        0,
        width,
        height
    );


    const fontSize =
        Math.min(
            width * .20,
            150
        );


    textCtx.font =
        `bold ${fontSize}px Arial`;


    textCtx.textAlign =
        "center";

    textCtx.textBaseline =
        "middle";


    textCtx.fillStyle =
        "white";


    textCtx.fillText(
        "KAFKA",
        width / 2,
        height / 2
    );


    const image =
        textCtx.getImageData(
            0,
            0,
            width,
            height
        );


    const points = [];


    for (
        let y = 0;
        y < height;
        y += 4
    ) {

        for (
            let x = 0;
            x < width;
            x += 4
        ) {

            const index =
                (y * width + x) * 4;


            if (
                image.data[
                    index + 3
                ] > 100
            ) {

                points.push({
                    x,
                    y
                });
            }
        }
    }


    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        const point =
            points[
                i % points.length
            ];


        particles[i].targetX =
            point.x;

        particles[i].targetY =
            point.y;
    }
}

createTargets();


/* ================================
   CLICK
================================ */

start.addEventListener(
    "click",
    () => {

        if (started) return;

        started = true;

        startTime =
            performance.now();

        start.classList.add(
            "hide"
        );


        /*
          Setelah diklik,
          KAFKA mulai muncul.
        */

        setTimeout(() => {

            name.classList.add(
                "show"
            );

        }, 1500);
    }
);


/* ================================
   ANIMATION
================================ */

function animate(time) {

    ctx.fillStyle =
        "rgba(2,0,6,.16)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    drawStars(time);


    const centerX =
        width / 2;

    const centerY =
        height / 2;


    /* ================================
       ORBIT
    ================================ */

    if (started) {

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            const radius =
                Math.min(
                    width,
                    height
                ) *
                (.18 + i * .09);


            ctx.beginPath();


            ctx.arc(
                centerX,
                centerY,
                radius,
                0,
                Math.PI * 2
            );


            ctx.strokeStyle =
                `rgba(
                    255,
                    80,
                    180,
                    ${.04 + i * .01}
                )`;


            ctx.lineWidth = 1;


            ctx.stroke();
        }
    }


    /* ================================
       PARTICLES
    ================================ */

    for (
        const particle of particles
    ) {

        if (started) {

            const attraction =
                .008 +
                (
                    Math.sin(
                        time * .0007
                    ) + 1
                ) *
                .012;


            particle.x +=
                (
                    particle.targetX -
                    particle.x
                ) *
                attraction;


            particle.y +=
                (
                    particle.targetY -
                    particle.y
                ) *
                attraction;


            particle.x +=
                Math.sin(
                    time * .001 +
                    particle.phase
                ) *
                .35;


            particle.y +=
                Math.cos(
                    time * .0012 +
                    particle.phase
                ) *
                .35;
        }


        ctx.beginPath();


        ctx.arc(
            particle.x,
            particle.y,
            particle.size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `rgba(
                255,
                ${120 + Math.random() * 80},
                225,
                ${particle.opacity}
            )`;


        ctx.shadowBlur = 14;

        ctx.shadowColor =
            "#ff4db8";


        ctx.fill();
    }


    /* ================================
       ORBIT LIGHT
    ================================ */

    if (started) {

        for (
            let i = 0;
            i < 8;
            i++
        ) {

            const angle =
                time * .0005 +
                i *
                Math.PI /
                4;


            const radius =
                Math.min(
                    width,
                    height
                ) *
                .35;


            const x =
                centerX +
                Math.cos(angle) *
                radius;


            const y =
                centerY +
                Math.sin(angle) *
                radius;


            ctx.beginPath();


            ctx.arc(
                x,
                y,
                2.5,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "#ffffff";


            ctx.shadowBlur =
                25;


            ctx.shadowColor =
                "#ff5bc7";


            ctx.fill();
        }
    }


    requestAnimationFrame(
        animate
    );
}


animate(0);

</script>

</body>
</html>
